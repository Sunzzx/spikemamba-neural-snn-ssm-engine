[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spikemamba"
version = "0.1.0"
description = "Event-Driven Neuromorphic Spiking State Space Model (SNN-SSM) Engine from Pure Numerical Primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kandwal", email = "ayufrom03@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
spikemamba-demo = "spikemamba.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
